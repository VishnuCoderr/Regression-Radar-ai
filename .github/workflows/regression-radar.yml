name: Regression Radar PR Risk Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      max_risk:
        description: "Maximum allowable risk score before failing the gate (0-100)"
        type: number
        required: false
        default: 60
      blocking:
        description: "Whether to block PR merge on risk gate failure"
        type: boolean
        required: false
        default: false
      require_tests:
        description: "Require matching tests for all modified source files"
        type: boolean
        required: false
        default: false
    secrets:
      GEMINI_API_KEY:
        required: false

# Least-privilege permissions
permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-pr-risk:
    name: Regression Radar Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Regression Radar
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Risk Analysis & Evaluate CI Gates
        id: risk_analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          BLOCKING_FLAG="${{ inputs.blocking && '--blocking' || '--non-blocking' }}"
          TEST_FLAG="${{ inputs.require_tests && '--require-tests' || '' }}"
          MAX_RISK="${{ inputs.max_risk || 60 }}"

          rr ci \
            --repo . \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --max-risk "$MAX_RISK" \
            $BLOCKING_FLAG \
            $TEST_FLAG \
            --output report.md \
            --post-comment

      - name: Upload Risk Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-radar-report
          path: report.md
          retention-days: 14
